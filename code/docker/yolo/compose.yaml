name: yolo

services:
  backend:
    image: yolo/backend:baseline
    build:
      context: ../..
      dockerfile: docker/yolo/backend.Dockerfile
    gpus: all
    init: true
    shm_size: 512mb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 6
    volumes:
      - type: bind
        source: ${VARROA_DATASET_PATH:-../../../DataSet/VarroaDataset-cls}
        target: /dataset
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./runs
        target: /runs
  frontend:
    image: yolo/frontend:local
    build:
      context: ../..
      dockerfile: docker/yolo/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${YOLO_WEB_PORT:-8088}:80"
